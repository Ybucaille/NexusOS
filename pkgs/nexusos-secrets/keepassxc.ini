# NexusOS defaults, copied once to ~/.config/keepassxc/keepassxc.ini.
# Everything not listed keeps KeePassXC's own default.

[General]
# The unlock window at login is the point; once unlocked, the tray.
MinimizeAfterUnlock=true

[GUI]
ShowTrayIcon=true
MinimizeToTray=true
# Closing must not quit: the Secret Service would vanish with it.
MinimizeOnClose=true

[Security]
ClearClipboard=true
ClearClipboardTimeout=10
LockDatabaseScreenLock=true
LockDatabaseOnUserSwitch=true

[FdoSecrets]
Enabled=true

[Browser]
Enabled=true
