# Build the nexusos package repository with the same scripts as a local build
# and publish it as a release named after its Arch snapshot date.
name: build-repo

on:
  push:
    branches: [main]
    paths:
      - 'pkgs/**'
      - 'ci/build-repo.sh'
      - 'ci/build-in-container.sh'
      - 'ci/test-dots.sh'
      - 'ci/publish-release.sh'
      - '.github/workflows/build-repo.yml'
  schedule:
    # Weekly and in full, so a new toolchain in the Arch snapshot is caught
    # before it reaches stable.
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Arch Linux Archive date (YYYY/MM/DD), empty for yesterday or the newer testing snapshot'
        required: false
      rebuild:
        description: 'Rebuild every package instead of reusing the unchanged ones from testing'
        type: boolean
        default: false

permissions:
  contents: write

# Two runs for the same date would race on the release assets.
concurrency:
  group: build-repo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # Yesterday, or the snapshot testing is on when a dispatch moved it
      # further: testing never goes back, and a push must still reach it.
      - name: Pick the snapshot
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.snapshot }}
        run: |
          snapshot=$INPUT
          if [[ -z $snapshot ]]; then
            snapshot=$(date -u -d yesterday +%Y/%m/%d)
            testing=$(gh release download testing -R "$GITHUB_REPOSITORY" -p nexusos-release -O - 2>/dev/null |
              sed -n 's/^snapshot=//p' || true)
            [[ ! $testing > $snapshot ]] || snapshot=$testing
          fi
          [[ $snapshot =~ ^[0-9]{4}/[0-9]{2}/[0-9]{2}$ ]] || { echo "bad snapshot: $snapshot" >&2; exit 1; }
          echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"
          echo "date=${snapshot//\//-}" >> "$GITHUB_OUTPUT"

      # The Qt build dependencies and the Quickshell tree need more room than
      # the runner leaves free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # The previous testing build: packages whose build key did not change are
      # taken from it, signatures checked, instead of being compiled again.
      # Without a release or a manifest (the first build), everything is built,
      # and so it is weekly: the key does not follow the toolchain.
      # Outside out/repo, so it is not published with this build.
      - name: Fetch the previous build
        if: ${{ github.event_name != 'schedule' && !inputs.rebuild }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/reuse
          gh release download testing -R "$GITHUB_REPOSITORY" -D out/reuse ||
            echo '::notice::no testing release to reuse packages from, building everything'

      - name: Build
        env:
          NEXUSOS_BUILD_MEMORY: 5g
          NEXUSOS_REUSE: ${{ github.event_name != 'schedule' && !inputs.rebuild && 'out/reuse' || '' }}
          NEXUSOS_SIGNING_KEY: ${{ secrets.NEXUSOS_SIGNING_KEY }}
        run: |
          [[ -n $NEXUSOS_SIGNING_KEY ]] || echo '::warning::NEXUSOS_SIGNING_KEY is not set, the repository is unsigned'
          NEXUSOS_BUILD_CPUS=$(nproc) ci/build-repo.sh '${{ steps.snapshot.outputs.snapshot }}'

      - name: Test the dots deployment
        run: ci/test-dots.sh '${{ steps.snapshot.outputs.snapshot }}'

      # The dated release keeps every build; testing follows the newest.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.snapshot.outputs.date }}
        run: |
          origin="built against the Arch Linux Archive snapshot of $DATE, from commit $GITHUB_SHA."
          ci/publish-release.sh "repo-$DATE" "out/repo/$DATE" "Package repository $DATE" \
            "pacman repository \`nexusos\` $origin"
          ci/publish-release.sh testing "out/repo/$DATE" "testing channel" \
            "NexusOS testing channel: every build that passes CI, $origin Set \`source = https://github.com/$GITHUB_REPOSITORY/releases/download/testing\` in /etc/nexusos/update.conf to follow it."
